# CONFIGURAÇÃO NGINX NEXTADS - VERSÃO CORRIGIDA PARA POST
# Copie este conteúdo para: /etc/nginx/sites-available/nextads

server {
    listen 80;
    server_name nextads.pro www.nextads.pro;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nextads.pro www.nextads.pro;

    # Upload 500MB
    client_max_body_size 500M;
    client_body_timeout 300s;
    client_body_buffer_size 128k;

    # SSL
    ssl_certificate /etc/letsencrypt/live/nextads.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nextads.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # UPLOADS
    location /uploads/ {
        alias /home/impulsione_midia1/nextads/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # API - CONFIGURAÇÃO SIMPLIFICADA E CORRIGIDA PARA POST
    location /api/ {
        # Tratamento específico para OPTIONS (preflight CORS)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Proxy para Node.js
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        
        # Headers essenciais
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Headers para WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Desabilitar buffering para POST pequenos
        proxy_buffering off;
        proxy_request_buffering off;
        
        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    }

    # JS FILES
    location /js/ {
        root /home/impulsione_midia1/nextads/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "application/javascript";
    }

    location ~* \.(js)$ {
        root /home/impulsione_midia1/nextads/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "application/javascript";
    }

    # FRONTEND
    location / {
        root /home/impulsione_midia1/nextads/public;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # STATIC FILES (excluindo /uploads/)
    location ~* ^(?!/uploads/).*\.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|mp4|mov)$ {
        root /home/impulsione_midia1/nextads/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SECURITY
    location ~ /\. {
        deny all;
    }
    
    location ~ \.(htaccess|htpasswd|ini|log|sh|sql|conf|env)$ {
        deny all;
    }
}